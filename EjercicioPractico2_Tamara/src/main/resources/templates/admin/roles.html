<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::body})">

<body>

<h2>Gestión de roles</h2>

<a th:href="@{/admin/roles/nuevo}">Crear rol</a>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
    </tr>

    <tr th:each="r : ${roles}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.nombre}"></td>
        <td th:text="${r.descripcion}"></td>
        <td>
            <a th:href="@{'/admin/roles/editar/' + ${r.id}}">Editar</a> |
            <a th:href="@{'/admin/roles/eliminar/' + ${r.id}}">Eliminar</a>
        </td>
    </tr>
</table>

</body>
</html>
